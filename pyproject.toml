[project]
name = "crypto-arbitrage"
version = "0.1.0"
description = "Bybit and Bitget cross-exchange perpetual arbitrage research and paper replay"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.28,<1", "numpy>=2.1,<3", "websockets>=15,<17"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "pandas>=2.2,<4"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/btc_cta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
