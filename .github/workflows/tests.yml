name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests
      - run: python -m pytest research/arb-runs/20261013-btw-microstructure-gate-code/test_*.py
      - run: c++ -std=c++20 -O2 research/arb-runs/20261013-btw-microstructure-gate-code/perfect_taker.cpp -o /tmp/crypto-arbitrage-perfect-taker
